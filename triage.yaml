openapi: 3.1.0
info:
  title: AST Triage API
  description: REST API for triggering triage operations
  version: 1.0.0
paths:
  /triage:
    post:
      tags:
      - triage
      summary: Create Triage
      description: 'Create a new triage request and publish a work event to RabbitMQ.


        This endpoint is idempotent - duplicate requests return 202 without

        publishing additional messages to RabbitMQ.'
      operationId: create_triage_triage_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriageRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageAcceptedResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '402':
          description: Payment Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /triage/{scan_id}:
    get:
      tags:
      - triage
      summary: Get Triage
      description: 'Retrieve triage results for a specific scan from S3.


        When no results are found but triage is still in progress (Redis task

        tokens exist), returns 200 with status "processing" instead of 404.


        When ``result_ids`` is set and S3 has no object yet, looks up the per-result

        Redis SSE snapshot (written on each ``UpdateTriageStatus``) and returns

        ``source: redis_sse_status`` if present.'
      operationId: get_triage_triage__scan_id__get
      parameters:
      - name: scan_id
        in: path
        required: true
        schema:
          type: string
          title: Scan Id
      - name: result_ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: Optional filter for specific result IDs
          title: Result Ids
        description: Optional filter for specific result IDs
      - name: include_reasoning_trace
        in: query
        required: false
        schema:
          type: boolean
          description: Include detailed agent reasoning trace with verification steps
          default: false
          title: Include Reasoning Trace
        description: Include detailed agent reasoning trace with verification steps
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Triage Triage  Scan Id  Get
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriageErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    TriageAcceptedResponse:
      properties:
        scanID:
          type: string
          title: Scanid
        status:
          type: string
          title: Status
          default: accepted
        queued:
          type: integer
          title: Queued
          description: Number of vulnerabilities queued for triage
      type: object
      required:
      - scanID
      - queued
      title: TriageAcceptedResponse
      description: "202 Accepted response for POST /triage.\n\nAttributes:\n    scan_id:\
        \ The scan identifier (JSON: scanID).\n    status: Always \"accepted\".\n\
        \    queued: Number of vulnerabilities queued for triage.\n\nNote:\n    Correlation\
        \ ID is returned in the X-Correlation-ID response header."
    TriageBucket:
      properties:
        scannerType:
          type: string
          title: Scannertype
          description: sast or sca (case-insensitive)
        resultIDs:
          items:
            type: string
          type: array
          title: Resultids
          description: Result IDs for this scanner; empty means all results for it
      type: object
      required:
      - scannerType
      title: TriageBucket
      description: One scanner's result IDs in a POST /triage body.
    TriageErrorResponse:
      properties:
        error:
          type: string
          title: Error
        message:
          type: string
          title: Message
      type: object
      required:
      - error
      - message
      title: TriageErrorResponse
      description: "Error response body.\n\nAttributes:\n    error: Error code or\
        \ type.\n    message: Human-readable error message."
    TriageRequest:
      properties:
        scanID:
          type: string
          minLength: 1
          title: Scanid
          description: Scan identifier
        buckets:
          items:
            $ref: '#/components/schemas/TriageBucket'
          type: array
          minItems: 1
          title: Buckets
          description: At least one scanner bucket is required
        force:
          type: boolean
          title: Force
          description: Bypass idempotency check
          default: false
      type: object
      required:
      - scanID
      - buckets
      title: TriageRequest
      description: "POST /triage request body.\n\nAttributes:\n    scan_id: The scan\
        \ identifier (JSON: scanID).\n    buckets: Per-scanner result sets to triage.\n\
        \    force: Bypass idempotency check."
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
